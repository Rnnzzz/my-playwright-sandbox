name: Playwright Sandbox Tests
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  run-smoke-tests:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    
    - name: Get Playwright version
      id: playwright-version
      run: echo "version=$(npm ls @playwright/test --json | jq -r '.dependencies."@playwright/test".version')" >> $GITHUB_OUTPUT

    - name: Cache Playwright Browsers
      id: playwright-cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

    - name: Install Playwright Browsers (Cache Miss)
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: npx playwright install chromium --with-deps

    - name: Install Playwright System Dependencies Only (Cache Hit)
      if: steps.playwright-cache.outputs.cache-hit == 'true'
      run: npx playwright install-deps

    - name: Run Playwright tests (API)
      run: npm run test:api -- --reporter=blob --output=blob-report/api
      continue-on-error: true

    - name: Run Playwright tests (WEB)
      run: npm run test:web -- --reporter=blob --output=blob-report/web
      continue-on-error: true

    - name: Merge Result to generate HTML Report
      if: always()
      run: npx playwright merge-reports --reporter=html ./blob-report

    - name: Generate Report Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-smoke-test-result
        path: playwright-report/
        retention-days: 3
